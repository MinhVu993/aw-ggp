version: '3.8'

services:
  # App Next.js GGP (Good Gate Pass)
  ggp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ggp-app
    restart: unless-stopped
    ports:
      - '7301:3000'
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/ps/ggp
      - DATABASE_URL=postgresql://postgres:abcd%401234@10.13.34.188:5432/ggp_db
      - MYSQL_HOST=10.1.16.89
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./public/reports:/app/public/reports
    networks:
      - ggp-network

networks:
  ggp-network:
    driver: bridge

